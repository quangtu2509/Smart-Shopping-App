</div>
</div>
<!-- Main Card Container -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col items-center">
<!-- Title & Context -->
<div class="w-full text-center space-y-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Xác thực mã OTP</h2>
<p class="font-body-md text-body-md text-on-secondary-container">
        Mã xác thực gồm 6 chữ số đã được gửi đến
      </p>
<!-- Email Badge with Edit Action -->
<div class="pt-space-xs flex items-center justify-center">
<div class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-secondary-container text-on-secondary-fixed">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">mail</span>
<span class="font-label-lg text-label-lg font-semibold text-on-surface">linh.tran@email.com</span>
<button aria-label="Thay đổi email" class="ml-1 w-6 h-6 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-lowest active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[15px]">edit</span>
</button>
</div>
</div>
</div>
<!-- OTP 6-Digit Entry Fields -->
<div class="w-full mt-space-lg">
<div class="flex justify-between items-center gap-2 max-w-[340px] mx-auto" id="otp-container">
<!-- Digit 1 (Filled) -->
<input aria-label="Ký tự OTP 1" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-primary bg-secondary-container/40 rounded-xl focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text" value="4">
<!-- Digit 2 (Filled) -->
<input aria-label="Ký tự OTP 2" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-primary bg-secondary-container/40 rounded-xl focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text" value="8">
<!-- Digit 3 (Filled) -->
<input aria-label="Ký tự OTP 3" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-primary bg-secondary-container/40 rounded-xl focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text" value="2">
<!-- Digit 4 (Active/Empty) -->
<input aria-label="Ký tự OTP 4" autofocus="" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest shadow-sm rounded-xl focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text">
<!-- Digit 5 (Empty) -->
<input aria-label="Ký tự OTP 5" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-low rounded-xl focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text">
<!-- Digit 6 (Empty) -->
<input aria-label="Ký tự OTP 6" class="otp-input w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-low rounded-xl focus:bg-surface-container-lowest focus:shadow-md outline-none transition-all caret-primary" inputmode="numeric" maxlength="1" type="text">
</div>
</div>
<!-- Countdown & Resend Triggers -->
<div class="mt-space-md flex flex-col items-center gap-1.5">
<div class="flex items-center gap-1.5 text-on-secondary-container font-label-md text-label-md">

<span>Mã có hiệu lực trong:</span>

</div>

<button class="font-label-lg text-label-lg font-semibold text-primary opacity-60 transition-opacity hover:opacity-100 disabled:cursor-not-allowed" id="btn-resend" type="button" disabled="">
          Gửi lại mã
        </button>
</div>
</div>
<!-- Primary Action Button (52px height) -->
<button class="mt-space-lg w-full h-[52px] rounded-2xl bg-primary text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-primary-container active:scale-[0.99] transition-all" type="button">
<span>Xác nhận &amp; Tiếp tục</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Friendly Assistance Callout -->
<div class="mt-space-md w-full bg-secondary-container/50 rounded-xl p-space-sm flex items-start gap-space-sm">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<div class="flex-1 text-on-secondary-fixed-variant font-body-sm text-body-sm leading-relaxed">
        Gặp sự cố khi nhận mã? Vui lòng kiểm tra hộp thư rác (Spam) hoặc <a class="text-primary font-semibold underline decoration-primary/40" href="#support">Liên hệ trợ giúp</a>.
      </div>
</div>
</div>
<!-- Trust & Security Badge Footer -->
<div class="mt-space-lg flex items-center justify-center gap-2 text-on-secondary-container">
<div class="w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[15px] text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<span class="font-label-sm text-label-sm tracking-wide uppercase font-semibold text-secondary">
      Dữ liệu được mã hóa an toàn 256-bit
    </span>
</div>
</div>
<script>
  (function initOtpFlow() {
    const inputs = Array.from(document.querySelectorAll('#otp-container .otp-input'));
    const countdownEl = document.getElementById('countdown-timer');
    const resendBtn = document.getElementById('btn-resend');

    // Smooth OTP input auto-advance
    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val.length >= 1) {
          e.target.value = val.slice(-1);
          if (idx < inputs.length - 1) {
            inputs[idx + 1].focus();
            inputs[idx + 1].select();
          }
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          inputs[idx - 1].focus();
          inputs[idx - 1].select();
        }
      });
    });

    // 119s countdown timer
    let timeLeft = 119;
    const interval = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(interval);
        countdownEl.textContent = '00:00';
        resendBtn.removeAttribute('disabled');
        resendBtn.classList.remove('opacity-60');
        resendBtn.classList.add('cursor-pointer');
        return;
      }
      timeLeft -= 1;
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secs = String(timeLeft % 60).padStart(2, '0');
      countdownEl.textContent = `${mins}:${secs}`;
    }, 1000);
  })();
</script></main></body></html>
