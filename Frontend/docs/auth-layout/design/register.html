-container-low": "#eff4ff", "tertiary": "#ba0035" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "1rem", "margin-mobile": "1rem", "space-lg": "1.5rem", "gutter-mobile": "0.75rem", "space-xs": "0.25rem", "gutter": "1rem", "space-xl": "2rem", "margin": "1.5rem", "space-sm": "0.5rem" }, fontFamily: { "label-sm": ["Inter"], "label-lg": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-lg": ["Inter"], "display-lg-mobile": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-md": ["Inter"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center justify-between"><button aria-label="Quay lại" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors -ml-space-xs" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface text-center flex-1 truncate px-space-sm">Sign Up</h1><div class="flex items-center justify-end w-11 h-11"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1XCvS1tsSXo5iGpIs6-Y8hkVH4MdUyCPhKQVQpdtTQKNueWIRJdRC7S-2EAAypoq786NwJKSMcGUlAceHypz2TUkGvTF3k4cma_hErJauln0m4dYkBY5AzHzSGI3w7XEXDIPl7VMivEizfo6PR3tRDaWgjCoYX3OCYzQMIHUOqGoGQR22Aa8OcBqwt5aRvk3PRqCjYwK6u7CZBw5Mi2nbR917KInnYUiFyePGs5wVawlmbISNctmvviyH6gNo-BNuvz7DAUshK__Fk"></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Brand & Identity Section -->
<div class="flex flex-col items-center pt-space-md pb-space-sm text-center">
<div class="w-[136px] flex items-center justify-center mb-space-sm">
<img alt="Smart Shopping Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCSyqN4I8564gTQL-Vort4ima1fzOvRuwmDiTPfxInC08j4FXoVHkyvmNS_UINnwXBuOpDVQrPt1W6GA_A2nMovqOPR1FgcjOHWRxh3kESjSQpuQv0vEa6zUWRQbKvgz5T7iaszNTrHB2126arKrI0N_Ip65QwgsVx7p5Wz9cVVBbhsoVecaM5rvnOprOZLKlb3Sa1E2hAbaOkRcjrtVFrw1acigkEJsMEMovENsYkxDdtWP-cl04c7iJBjjOZU0spGFi4">
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Tạo tài khoản</h2>
<p class="font-body-md text-body-md text-secondary mt-space-xs">Bắt đầu lên kế hoạch mua sắm thông minh hơn.</p>
</div>
<!-- Social Registration (Google Only) -->
<div class="mt-space-md">
<button class="w-full h-[52px] bg-surface-container-lowest text-on-surface rounded-2xl shadow-sm flex items-center justify-center gap-space-sm px-space-md active:bg-surface-container-low transition-colors duration-150" type="button">
<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Tiếp tục với Google</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center my-space-lg">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="px-space-sm font-label-sm text-label-sm text-secondary uppercase tracking-wider">hoặc đăng ký bằng email</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-3xl p-5 shadow-sm flex flex-col gap-space-md">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="h-12 bg-surface-container-low rounded-xl flex items-center px-space-md gap-space-sm focus-within:bg-surface-container">
<span class="material-symbols-outlined text-secondary text-[20px]">mail</span>
<input class="bg-transparent border-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-secondary focus:ring-0 p-0" id="email" placeholder="nhap.email@vidu.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Mật khẩu</label>
<div class="h-12 bg-surface-container-low rounded-xl flex items-center px-space-md gap-space-sm focus-within:bg-surface-container">
<span class="material-symbols-outlined text-secondary text-[20px]">lock</span>
<input class="bg-transparent border-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-secondary focus:ring-0 p-0" id="password" placeholder="Nhập mật khẩu" type="password">
<button aria-label="Ẩn hiện mật khẩu" class="text-secondary hover:text-on-surface flex items-center justify-center p-1" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex items-center gap-1.5 mt-0.5 px-1">
<span class="material-symbols-outlined text-secondary text-[16px]" id="pwd-check-icon">check_circle</span>
<span class="font-label-sm text-label-sm text-secondary" id="pwd-check-text">Ít nhất 8 ký tự</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Xác nhận mật khẩu</label>
<div class="h-12 bg-surface-container-low rounded-xl flex items-center px-space-md gap-space-sm focus-within:bg-surface-container">
<span class="material-symbols-outlined text-secondary text-[20px]">lock_reset</span>
<input class="bg-transparent border-0 outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-secondary focus:ring-0 p-0" id="confirm-password" placeholder="Nhập lại mật khẩu" type="password">
<button aria-label="Ẩn hiện mật khẩu xác nhận" class="text-secondary hover:text-on-surface flex items-center justify-center p-1" onclick="togglePasswordVisibility('confirm-password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Primary Button -->
<button class="w-full h-[52px] bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-2xl flex items-center justify-center gap-space-sm shadow-md mt-space-xs active:scale-[0.99] transition-all" type="button">
<span>Tạo tài khoản</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Footer Navigation & Trust Signals -->
<div class="flex flex-col items-center mt-space-lg gap-space-md">
<div class="flex items-center gap-1 text-center">
<span class="font-body-md text-body-md text-secondary">Đã có tài khoản?</span>
<a class="font-label-lg text-label-lg text-primary hover:text-primary-container" href="#">Đăng nhập</a>
</div>
<!-- Security Encryption Badge -->
<div class="flex items-center gap-2 bg-secondary-container px-space-md py-1.5 rounded-full">
<span class="material-symbols-outlined text-primary text-[18px]">verified_user</span>
<span class="font-label-sm text-label-sm text-primary">Dữ liệu được mã hóa an toàn chuẩn 256-bit</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  const pwdInput = document.getElementById('password');
  const checkIcon = document.getElementById('pwd-check-icon');
  const checkText = document.getElementById('pwd-check-text');

  if (pwdInput && checkIcon && checkText) {
    pwdInput.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val.length >= 8) {
        checkIcon.classList.remove('text-secondary');
        checkIcon.classList.add('text-primary');
        checkText.classList.remove('text-secondary');
        checkText.classList.add('text-primary');
      } else {
        checkIcon.classList.add('text-secondary');
        checkIcon.classList.remove('text-primary');
        checkText.classList.add('text-secondary');
        checkText.classList.remove('text-primary');
      }
    });
  }
</script></main></body></html>
